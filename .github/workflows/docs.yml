name: Generate & Deploy Doxygen Docs

on:
  push:
    branches: [ "main" ] # Cambia in "master" se il tuo ramo principale si chiama master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Installa Doxygen e Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Esegui Doxygen
        run: doxygen Doxyfile

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Carica artefatti HTML
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'html'

      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
